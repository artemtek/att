<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>users</title>
</head>
<body>
  <h1>users</h1>
  <p id="error"></p>
  <form id="create">
    name: <input name="name" required>
    email: <input name="email" type="email" required>
    <button>create</button>
  </form>
  <h2>list</h2>
  <table id="list"></table>
  <script src="/common.js"></script>
  <script>
    async function load() {
      const users = await api("GET", "/api/users");
      const t = document.getElementById("list");
      t.innerHTML = "<tr><th>id</th><th>name</th><th>email</th></tr>" +
        users.map((u) =>
          `<tr><td>${u.id}</td><td><a href="/user.html?id=${u.id}">${esc(u.name)}</a></td><td>${esc(u.email)}</td></tr>`
        ).join("");
    }
    document.getElementById("create").onsubmit = async (e) => {
      e.preventDefault();
      try {
        await api("POST", "/api/users", formValues(e.target));
        location.reload();
      } catch (err) {
        showError(err);
      }
    };
    load().catch(showError);
  </script>
</body>
</html>
