<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>task defs</title>
</head>
<body>
  <h1>task defs</h1>
  <p id="error"></p>
  <form id="create">
    name: <input name="name" required>
    type: <select name="type"><option value="acknowledgement">acknowledgement</option><option value="document">document</option></select>
    valid_for_days: <input name="valid_for_days" type="number" min="1">
    requires approval: <input type="checkbox" name="requires_approval" value="true">
    completion date: <input type="checkbox" name="requires_completion_date" value="true">
    <div id="approver-fields"></div>
    <button>create</button>
  </form>
  <h2>list</h2>
  <table id="list"></table>
  <script src="/common.js"></script>
  <script>
    async function load() {
      const roles = await api("GET", "/api/roles");
      document.getElementById("approver-fields").innerHTML = "approver roles: " + roleChecks("approver_roles", roles, []);
      const rows = await api("GET", "/api/task-defs");
      document.getElementById("list").innerHTML =
        "<tr><th>id</th><th>name</th><th>type</th><th>approval</th><th>approver_roles</th><th>valid_for_days</th></tr>" +
        rows.map((r) =>
          `<tr>
            <td>${r.id}</td>
            <td><a href="/task.html?id=${r.id}">${esc(r.name)}</a></td>
            <td>${esc(r.type)}</td>
            <td>${r.requires_approval ? "yes" : "no"}</td>
            <td>${esc((r.approver_roles || []).join(", "))}</td>
            <td>${esc(r.valid_for_days || "")}</td>
          </tr>`
        ).join("");
    }
    document.getElementById("create").onsubmit = async (e) => {
      e.preventDefault();
      try {
        const v = formValues(e.target);
        if (v.valid_for_days === "") delete v.valid_for_days;
        v.requires_approval = e.target.requires_approval.checked;
        v.requires_completion_date = e.target.requires_completion_date.checked;
        v.approver_roles = checked(e.target, "approver_roles");
        await api("POST", "/api/task-defs", v);
        location.reload();
      } catch (err) { showError(err); }
    };
    load().catch(showError);
  </script>
</body>
</html>
